name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        # 테스트가 services.sync.main / services.mcp_server.main 을 import 한다.
        # mcp 의존성을 빼면 검색·인증 테스트가 ModuleNotFoundError 로 죽는데,
        # 파서 의존성(rhwp 네이티브 휠)은 여기서 받지 않으므로 제외한다.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-sync.txt -r requirements-mcp.txt

      - name: Test
        run: pytest -q

      # 기존 코드에 미해결 위반이 남아 있어 아직 게이트로 쓰지 않는다.
      # 정리 후 continue-on-error를 제거할 것.
      - name: Lint (report only)
        continue-on-error: true
        run: ruff check . --output-format=github
