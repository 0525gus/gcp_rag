# 공통 배포값.
#
# 우선순위: config/departments/<학과>.yaml > 이 파일 > 코드 기본값
#   - 학과 파일이 같은 키를 쓰면 그쪽이 이긴다
#   - 배포 스크립트는 학과를 순회하며 **매번 env 를 비우고** 다시 채운다.
#     그래서 셸에 미리 넣어 둔 값은 이기지 못한다 — 앞 학과 값이 남는 쪽이
#     사고이기 때문이다(코퍼스·키가 섞인다). 일회성 변경은 이 파일을 고칠 것
#
# 키 이름은 서비스가 읽는 환경변수명과 1:1 로 맞춘다.

GCP_PROJECT_ID: constant-cubist-506002-h7
GCP_REGION: asia-northeast3
ARTIFACT_REPO: rag-mcp

GCS_HWP_ORIGINAL_BUCKET: test-rag-hwp-bkt
GCS_SOURCE_BUCKET: test-rag-source-bkt

FIRESTORE_DATABASE: rag-sync-state
DOC_STATE_COLLECTION: doc_state

# 품질 게이트: log=경고만 | reject=422/DLQ | fallback=Document AI
# fallback 은 parser 이미지에 LibreOffice 가 없어 런타임에 터진다(preflight 가 경고).
QG_MODE: log

# Drive→GCS ingest 병렬 워커
INGEST_CONCURRENCY: 8
# RagFile 삭제 동시수·간격. 소모율 ≈ 동시수 / (0.4 + 페이싱). 기본 1은 60rpm 쿼터 기준
RAG_DELETE_CONCURRENCY: 1
RAG_DELETE_PACING_SECONDS: 1.1

# --- Cloud Run 인스턴스 설정 (배포 인자 전용. 서비스 env 로는 안 들어간다) ---
# parser timeout 540 < sync httpx 600. 서버가 먼저 포기해야 sync 가 오류를 받는다
PARSER_TIMEOUT: 540
# 요청당 메모리 한계. 넘치는 요청은 새 인스턴스로
PARSER_CONCURRENCY: 4
PARSER_MAX_INSTANCES: 10
SYNC_CONCURRENCY: 4

# 검색 튜닝. 근거는 shared/config.py 주석 참고
TOP_K_DEFAULT: 5
SEARCH_FETCH_MULTIPLIER: 3
SEARCH_FETCH_MAX: 60

MCP_CONCURRENCY: 40
# true 여야 FactChat 커넥터가 붙는다(정적 헤더만 보내므로).
# 이때 경계는 앱 계층 키 하나뿐이다 — 키가 새면 그 학과 그 코퍼스가 열린다.
ALLOW_UNAUTH: true
