# =============================================================================
# Cloud Workflows — 일일 Drive → GCS → RAG 동기화 (v2)
# HWP/HWPX: Parser(rhwp-python) → GCS MD → RAG import
# 기타: export/copy → GCS → RAG import (Drive 네이티브 커넥터 미사용)
# QG_MODE=log 기본 — 품질 게이트는 파서 로그, 배치 중단 없음
# Scheduler: 0 0 * * * Asia/Seoul
# =============================================================================
#
#   Scheduler / 수동 실행
#     → for each driveId
#         → backfill=true 이면 /sync/backfill (초기 전체)
#            아니면 /sync/changes (델타; 최초 토큰 없으면 backfill 스냅샷)
#         → for each change → ingest|delete
#         → /sync/index-gcs-async → job poll → reconcile → commit-token
#

main:
  params: [args]
  steps:
    - init:
        assign:
          # Workflows 표현식 안에서는 {} 맵 리터럴을 못 쓴다([] 는 된다).
          # default(..., {}) 가 파싱 에러로 배포를 막으므로 변수로 빼 둔다.
          - empty_map: {}
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "asia-northeast3"
          - sync_url: ${default(map.get(args, "syncUrl"), "https://SYNC_SERVICE_URL")}
          - parser_url: ${default(map.get(args, "parserUrl"), "https://PARSER_SERVICE_URL")}
          - drive_ids: ${default(map.get(args, "driveIds"), [])}
          # backfill(최대 50)와 reindex-pending(최대 25)이 함께 쓰는 값이다.
          - index_batch_size: ${default(map.get(args, "indexBatchSize"), 24)}
          - do_backfill: ${default(map.get(args, "backfill"), false)}
          - run_id: ${default(map.get(args, "runId"), "")}
          - department_code: ${default(map.get(args, "departmentCode"), "")}
          # 과거 PARSED/DLQ 복구는 일반 변경분 동기화와 분리한다. 기본 실행에
          # 섞으면 변경 1건이어도 전역 backlog 200건 때문에 수분씩 지연된다.
          - run_recovery: ${default(map.get(args, "runRecovery"), false)}
          - drive_count: ${len(drive_ids)}
          - drive_index: 0
          - recover_limit: ${default(map.get(args, "recoverLimit"), 200)}
          - retry_max_attempts: ${default(map.get(args, "retryMaxAttempts"), 3)}
          # 델타 1페이지당 변경 건수. Workflows 변수 한도 512KB 대비 안전 마진
          # (200건 ≈ 174KB). 남은 분량은 hasMore 로 이어 처리한다.
          - max_changes: ${default(map.get(args, "maxChanges"), 200)}
          # 한 실행에서 Drive 하나가 돌 수 있는 최대 페이지 (무한 루프 방지)
          - max_pages: ${default(map.get(args, "maxPages"), 50)}
          - totals:
              listed: 0
              gcsUploaded: 0
              indexed: 0
              failed: 0
              skipped: 0
              deleted: 0
              unchanged: 0
              dlq: 0
              splitQueued: 0
              excluded: 0
              indexFailed: 0
              # DLQ·분할 대기로 보낸 문서. failed 와 분리한다 — 아래 commit_token
              # 주석 참고. 이 값은 커밋을 막지 않는다.
              parked: 0

    - for_each_drive:
        for:
          value: drive_id
          in: ${drive_ids}
          steps:
            # Drive 진입 시 1회. 페이지 루프는 sync_page 부터 반복한다.
            - reset_drive_state:
                assign:
                  - drive_index: ${drive_index + 1}
                  - drive_page: 0
                  - drive_has_more: true
                  - drive_backfill: ${do_backfill}

            # ----- 페이지 루프 시작 (hasMore 인 동안 반복) -----
            - sync_page:
                assign:
                  - drive_page: ${drive_page + 1}
                  - change_list: []
                  - pending_page_token: ""
                  - pending_uris: []
                  - pending_file_ids: []
                  - pending_items: []
                  - drive_listed: 0
                  - drive_gcs: 0
                  - drive_uris: 0
                  - drive_indexed: 0
                  - drive_failed: 0
                  - drive_index_failed: 0
                  - drive_reconciled: false
                  - drive_skipped: 0
                  - drive_deleted: 0
                  - drive_unchanged: 0
                  - drive_dlq: 0
                  - drive_split: 0
                  - drive_excluded: 0
                  - drive_parked: 0
                  - drive_has_more: false

            # ----- 1) 초기 backfill-run 또는 Changes 델타 -----
            - fetch_source:
                switch:
                  - condition: ${drive_backfill == true}
                    steps:
                      - run_backfill:
                          try:
                            call: http.post
                            args:
                              url: ${sync_url + "/sync/backfill-run"}
                              auth:
                                type: OIDC
                              body:
                                driveId: ${drive_id}
                                parserUrl: ${parser_url}
                                indexBatchSize: ${index_batch_size}
                                runId: ${run_id}
                                departmentCode: ${department_code}
                                driveIndex: ${drive_index}
                                driveCount: ${drive_count}
                              timeout: 1800
                            result: backfill_resp
                          retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 2
                            backoff:
                              initial_delay: 5
                              max_delay: 60
                              multiplier: 2
                          except:
                            as: backfill_err
                            steps:
                              - tally_backfill_source_failure:
                                  assign:
                                    # 응답을 받지 못한 Drive 자체를 운영 실패 1건으로 집계한다.
                                    - drive_failed: ${drive_failed + 1}
                                    - totals.failed: ${totals.failed + 1}
                              - log_backfill_source_failure:
                                  call: sys.log
                                  args:
                                    severity: "ERROR"
                                    text: ${"backfill-run exhausted retries drive=" + drive_id + " " + json.encode_to_string(backfill_err)}
                              - continue_after_backfill_source_failure:
                                  # backfill_resp가 없으므로 성공 응답 처리 단계를 건너뛴다.
                                  next: continue
                      - apply_backfill_totals:
                          assign:
                            - drive_listed: ${default(backfill_resp.body.totals.listed, 0)}
                            - drive_gcs: ${default(backfill_resp.body.totals.gcsUploaded, 0)}
                            - drive_uris: ${default(backfill_resp.body.totals.uris, 0)}
                            - drive_indexed: ${default(backfill_resp.body.totals.indexed, 0)}
                            - drive_failed: ${default(backfill_resp.body.totals.failed, 0)}
                            - drive_index_failed: ${default(backfill_resp.body.totals.indexFailed, 0)}
                            - drive_skipped: ${default(backfill_resp.body.totals.skipped, 0)}
                            - drive_unchanged: ${default(backfill_resp.body.totals.unchanged, 0)}
                            - drive_dlq: ${default(backfill_resp.body.totals.dlq, 0)}
                            - drive_split: ${default(backfill_resp.body.totals.splitQueued, 0)}
                            - drive_parked: ${default(backfill_resp.body.totals.parked, 0)}
                            - drive_excluded: ${default(backfill_resp.body.totals.excluded, 0)}
                            - pending_page_token: ${default(backfill_resp.body.pendingPageToken, "")}
                            - pending_uris: []
                            - pending_file_ids: []
                            - change_list: []
                            # backfill-run 이 드라이브 전체를 끝내므로 페이지 루프는 여기서 종료
                            - drive_backfill: false
                            - drive_has_more: false
                            - totals.listed: ${totals.listed + default(backfill_resp.body.totals.listed, 0)}
                            - totals.gcsUploaded: ${totals.gcsUploaded + default(backfill_resp.body.totals.gcsUploaded, 0)}
                            - totals.indexed: ${totals.indexed + default(backfill_resp.body.totals.indexed, 0)}
                            - totals.failed: ${totals.failed + default(backfill_resp.body.totals.failed, 0)}
                            - totals.indexFailed: ${totals.indexFailed + default(backfill_resp.body.totals.indexFailed, 0)}
                            - totals.skipped: ${totals.skipped + default(backfill_resp.body.totals.skipped, 0)}
                            - totals.unchanged: ${totals.unchanged + default(backfill_resp.body.totals.unchanged, 0)}
                            - totals.dlq: ${totals.dlq + default(backfill_resp.body.totals.dlq, 0)}
                            - totals.splitQueued: ${totals.splitQueued + default(backfill_resp.body.totals.splitQueued, 0)}
                            - totals.parked: ${totals.parked + default(backfill_resp.body.totals.parked, 0)}
                            - totals.excluded: ${totals.excluded + default(backfill_resp.body.totals.excluded, 0)}
                      - log_backfill:
                          call: sys.log
                          args:
                            severity: "INFO"
                            text: ${"backfill-run drive=" + drive_id + " " + json.encode_to_string(backfill_resp.body.totals)}
                      - skip_to_reconcile:
                          next: reconcile_drive
                  - condition: true
                    steps:
                      - fetch_changes:
                          try:
                            call: http.post
                            args:
                              url: ${sync_url + "/sync/changes"}
                              auth:
                                type: OIDC
                              body:
                                driveId: ${drive_id}
                                maxChanges: ${max_changes}
                              timeout: 300
                            result: changes_resp
                          retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 5
                            backoff:
                              initial_delay: 2
                              max_delay: 60
                              multiplier: 2
                          except:
                            as: changes_err
                            steps:
                              - tally_changes_source_failure:
                                  assign:
                                    # 응답을 받지 못한 Drive 자체를 운영 실패 1건으로 집계한다.
                                    - drive_failed: ${drive_failed + 1}
                                    - totals.failed: ${totals.failed + 1}
                              - log_changes_source_failure:
                                  call: sys.log
                                  args:
                                    severity: "ERROR"
                                    text: ${"fetch-changes exhausted retries drive=" + drive_id + " " + json.encode_to_string(changes_err)}
                              - continue_after_changes_source_failure:
                                  # changes_resp가 없으므로 assign_changes 이후를 실행하지 않는다.
                                  next: continue

            # 토큰이 없으면(최초 실행) 전체 스냅샷을 워크플로우 변수에 올릴 수 없다.
            # 서버 안에서 끝내는 backfill-run 으로 넘기고 fetch_source 를 다시 탄다.
            - check_backfill_required:
                switch:
                  - condition: ${default(changes_resp.body.mode, "delta") == "backfill_required"}
                    steps:
                      - switch_to_backfill:
                          assign:
                            - drive_backfill: true
                      - log_backfill_required:
                          call: sys.log
                          args:
                            severity: "INFO"
                            text: ${"no page token drive=" + drive_id + " — switching to backfill-run"}
                      - restart_as_backfill:
                          next: fetch_source

            - assign_changes:
                assign:
                  - change_list: ${default(changes_resp.body.changes, [])}
                  - pending_page_token: ${default(changes_resp.body.pendingPageToken, "")}
                  - drive_has_more: ${default(changes_resp.body.hasMore, false)}
                  - drive_listed: ${len(change_list)}
                  - totals.listed: ${totals.listed + len(change_list)}

            - log_delta:
                call: sys.log
                args:
                  severity: "INFO"
                  text: ${"drive=" + drive_id + " page=" + string(drive_page) + " mode=" + default(changes_resp.body.mode, "delta") + " changes=" + string(len(change_list)) + " hasMore=" + string(drive_has_more)}

            # ----- 2) 문서 단위 MIME 분기 (부분 실패 격리) -----
            - process_each:
                for:
                  value: change
                  in: ${change_list}
                  steps:
                    - route_switch:
                        switch:
                          # === 삭제 ===
                          - condition: ${change.route == "DELETE" or change.removed == true}
                            steps:
                              - do_delete:
                                  try:
                                    call: http.post
                                    args:
                                      url: ${sync_url + "/sync/delete"}
                                      auth:
                                        type: OIDC
                                      body:
                                        fileId: ${change.fileId}
                                        driveId: ${change.driveId}
                                      timeout: 300
                                    result: del_resp
                                  retry:
                                    predicate: ${http.default_retry_predicate}
                                    max_retries: 3
                                    backoff:
                                      initial_delay: 2
                                      max_delay: 30
                                      multiplier: 2
                                  except:
                                    as: del_err
                                    steps:
                                      - del_fail:
                                          assign:
                                            - drive_failed: ${drive_failed + 1}
                                            - totals.failed: ${totals.failed + 1}
                                      - del_log:
                                          call: sys.log
                                          args:
                                            severity: "ERROR"
                                            text: ${"delete failed fileId=" + change.fileId + " " + json.encode_to_string(del_err)}
                                      - log_delete_failed_item:
                                          call: sys.log
                                          args:
                                            severity: "INFO"
                                            text: ${"sync-file-result status=FAILED " + json.encode_to_string(change)}
                                      - del_continue:
                                          next: process_each_end
                              - del_ok:
                                  assign:
                                    - drive_deleted: ${drive_deleted + 1}
                                    - totals.deleted: ${totals.deleted + 1}
                              - log_deleted_item:
                                  call: sys.log
                                  args:
                                    severity: "INFO"
                                    text: ${"sync-file-result status=DELETED " + json.encode_to_string(change)}

                          # === 대상 폴더 밖 — 집계에서 제외 ===
                          # SKIP(대상인데 처리 못 함)과 구분한다. reconcile 이
                          # listed 에서 차감하므로 skipped 가 진짜 신호가 된다.
                          - condition: ${change.route == "EXCLUDE"}
                            steps:
                              - do_exclude:
                                  try:
                                    call: http.post
                                    args:
                                      url: ${sync_url + "/sync/ingest"}
                                      auth:
                                        type: OIDC
                                      body:
                                        fileId: ${change.fileId}
                                        driveId: ${change.driveId}
                                        name: ${change.name}
                                        mimeType: ${change.mimeType}
                                        modifiedTime: ${change.modifiedTime}
                                        removed: false
                                        webViewLink: ${change.webViewLink}
                                        route: "EXCLUDE"
                                        parserUrl: ${parser_url}
                                      timeout: 120
                                    result: exclude_resp
                                  except:
                                    as: exclude_err
                                    steps:
                                      - exclude_fail:
                                          assign:
                                            - drive_failed: ${drive_failed + 1}
                                            - totals.failed: ${totals.failed + 1}
                                      - exclude_continue:
                                          next: process_each_end
                              - exclude_ok:
                                  assign:
                                    - drive_excluded: ${drive_excluded + 1}
                                    - totals.excluded: ${totals.excluded + 1}
                              - log_excluded_item:
                                  call: sys.log
                                  args:
                                    severity: "INFO"
                                    text: ${"sync-file-result status=EXCLUDED " + json.encode_to_string(change)}

                          # === 미지원 스킵 ===
                          - condition: ${change.route == "SKIP"}
                            steps:
                              - do_skip:
                                  try:
                                    call: http.post
                                    args:
                                      url: ${sync_url + "/sync/ingest"}
                                      auth:
                                        type: OIDC
                                      body:
                                        fileId: ${change.fileId}
                                        driveId: ${change.driveId}
                                        name: ${change.name}
                                        mimeType: ${change.mimeType}
                                        modifiedTime: ${change.modifiedTime}
                                        removed: false
                                        webViewLink: ${change.webViewLink}
                                        route: "SKIP"
                                        parserUrl: ${parser_url}
                                      timeout: 120
                                    result: skip_resp
                                  # 범위 밖 파일의 정리는 fail closed(500)라 일시적
                                  # 오류도 실패로 온다. 재시도가 없으면 그 1건이
                                  # drive_failed 를 세워 pageToken 을 영구 미커밋으로
                                  # 굳히고, 다음 실행이 같은 페이지를 다시 받는다.
                                  retry:
                                    predicate: ${http.default_retry_predicate}
                                    max_retries: 3
                                    backoff:
                                      initial_delay: 2
                                      max_delay: 30
                                      multiplier: 2
                                  except:
                                    as: skip_err
                                    steps:
                                      - skip_fail:
                                          assign:
                                            - drive_failed: ${drive_failed + 1}
                                            - totals.failed: ${totals.failed + 1}
                                      - skip_log:
                                          call: sys.log
                                          args:
                                            severity: "ERROR"
                                            text: ${"skip/ingest failed fileId=" + change.fileId + " " + json.encode_to_string(skip_err)}
                                      - skip_continue:
                                          next: process_each_end
                              - skip_ok:
                                  assign:
                                    - drive_skipped: ${drive_skipped + 1}
                                    - totals.skipped: ${totals.skipped + 1}
                              - log_skipped_item:
                                  call: sys.log
                                  args:
                                    severity: "INFO"
                                    text: ${"sync-file-result status=SKIPPED " + json.encode_to_string(change)}

                          # === HWP/HWPX · Google export · 원본 복사 → GCS ===
                          - condition: ${change.route == "HWP_PARSE" or change.route == "GOOGLE_EXPORT" or change.route == "FILE_COPY"}
                            steps:
                              - do_ingest:
                                  try:
                                    call: http.post
                                    args:
                                      url: ${sync_url + "/sync/ingest"}
                                      auth:
                                        type: OIDC
                                      body:
                                        fileId: ${change.fileId}
                                        driveId: ${change.driveId}
                                        name: ${change.name}
                                        mimeType: ${change.mimeType}
                                        modifiedTime: ${change.modifiedTime}
                                        removed: false
                                        webViewLink: ${change.webViewLink}
                                        # 다운로드 전에 크기를 거르기 위해 전달
                                        sizeBytes: ${default(map.get(change, "sizeBytes"), null)}
                                        route: ${change.route}
                                        parserUrl: ${parser_url}
                                      timeout: 900
                                    result: ingest_resp
                                  retry:
                                    predicate: ${http.default_retry_predicate}
                                    max_retries: 3
                                    backoff:
                                      initial_delay: 2
                                      max_delay: 60
                                      multiplier: 2
                                  except:
                                    as: ingest_err
                                    steps:
                                      - ingest_fail:
                                          assign:
                                            - drive_failed: ${drive_failed + 1}
                                            - drive_dlq: ${drive_dlq + 1}
                                            - totals.failed: ${totals.failed + 1}
                                            - totals.dlq: ${totals.dlq + 1}
                                      - ingest_log:
                                          call: sys.log
                                          args:
                                            severity: "ERROR"
                                            text: ${"ingest failed fileId=" + change.fileId + " route=" + change.route + " " + json.encode_to_string(ingest_err)}
                                      - ingest_continue:
                                          next: process_each_end

                              - tally_ingest:
                                  switch:
                                    - condition: ${ingest_resp.body.status == "GCS_READY"}
                                      steps:
                                        # list.concat 은 두 번째 인자를 한 항목으로 붙인다.
                                        # gcsUris/list 와 [fileId] 를 그대로 넘기면 list[list]
                                        # 가 되어 /sync/index-gcs 가 422 를 반환한다.
                                        - collect_uris:
                                            for:
                                              value: pending_uri
                                              in: ${ingest_resp.body.gcsUris}
                                              steps:
                                                - append_uri:
                                                    assign:
                                                      - pending_uris: ${list.concat(pending_uris, pending_uri)}
                                        - tally_gcs_ready:
                                            assign:
                                              - pending_file_ids: ${list.concat(pending_file_ids, change.fileId)}
                                              - pending_items: ${list.concat(pending_items, change)}
                                              - drive_gcs: ${drive_gcs + 1}
                                              - drive_uris: ${drive_uris + len(ingest_resp.body.gcsUris)}
                                              - totals.gcsUploaded: ${totals.gcsUploaded + 1}
                                    - condition: ${ingest_resp.body.status == "UNCHANGED" or ingest_resp.body.status == "HASH_UNCHANGED"}
                                      steps:
                                        - tally_unchanged:
                                            assign:
                                              - drive_unchanged: ${drive_unchanged + 1}
                                              - totals.unchanged: ${totals.unchanged + 1}
                                        - log_unchanged_item:
                                            call: sys.log
                                            args:
                                              severity: "INFO"
                                              text: ${"sync-file-result status=UNCHANGED " + json.encode_to_string(change)}
                                    - condition: ${ingest_resp.body.status == "SKIPPED"}
                                      steps:
                                        - tally_skip2:
                                            assign:
                                              - drive_skipped: ${drive_skipped + 1}
                                              - totals.skipped: ${totals.skipped + 1}
                                        - log_skipped_ingest_item:
                                            call: sys.log
                                            args:
                                              severity: "INFO"
                                              text: ${"sync-file-result status=SKIPPED " + json.encode_to_string(change)}
                                    # DLQ·SPLIT_QUEUED 는 '실패'가 아니라 **판정을 마치고
                                    # 별도 큐로 보낸 것**이다. failed 로 세면 아래
                                    # commit_token 이 막히는데, 다시 처리해도 같은 결과라
                                    # 그 한 건이 드라이브의 pageToken 을 영구히 세운다
                                    # (같은 페이지가 매일 재생되고 뒷 페이지는 영영 처리 안 됨).
                                    # parked 로 분리해 커밋을 통과시키고, 문서는 큐에 남긴다.
                                    - condition: ${ingest_resp.body.status == "DLQ"}
                                      steps:
                                        - tally_dlq:
                                            assign:
                                              - drive_dlq: ${drive_dlq + 1}
                                              - drive_parked: ${drive_parked + 1}
                                              - totals.dlq: ${totals.dlq + 1}
                                              - totals.parked: ${totals.parked + 1}
                                        - log_dlq_item:
                                            call: sys.log
                                            args:
                                              severity: "INFO"
                                              text: ${"sync-file-result status=DLQ " + json.encode_to_string(change)}
                                    - condition: ${ingest_resp.body.status == "SPLIT_QUEUED"}
                                      steps:
                                        - tally_split:
                                            assign:
                                              - drive_split: ${drive_split + 1}
                                              - drive_parked: ${drive_parked + 1}
                                              - totals.splitQueued: ${totals.splitQueued + 1}
                                              - totals.parked: ${totals.parked + 1}
                                        - log_split_item:
                                            call: sys.log
                                            args:
                                              severity: "INFO"
                                              text: ${"sync-file-result status=SPLIT_QUEUED " + json.encode_to_string(change)}
                                    - condition: true
                                      steps:
                                        - tally_unknown:
                                            assign:
                                              - drive_failed: ${drive_failed + 1}
                                              - totals.failed: ${totals.failed + 1}
                                        - unknown_log:
                                            call: sys.log
                                            args:
                                              severity: "WARNING"
                                              text: ${"unexpected ingest status fileId=" + change.fileId + " status=" + default(ingest_resp.body.status, "null")}

                          # === 알 수 없는 route ===
                          - condition: true
                            steps:
                              - unknown_route:
                                  assign:
                                    - drive_failed: ${drive_failed + 1}
                                    - totals.failed: ${totals.failed + 1}
                              - unknown_route_log:
                                  call: sys.log
                                  args:
                                    severity: "WARNING"
                                    text: ${"unknown route fileId=" + change.fileId + " route=" + default(change.route, "null")}

                    - process_each_end:
                        assign:
                          - _: null

            # ----- 3) GCS → RAG Engine 증분 import -----
            # 페이지 하나가 모은 URI 를 한 번에 보낸다. indexBatchSize 는 여기 쓰이지
            # 않는다(서버 안에서 도는 backfill-run/복구 전용). 델타의 실질 배치 크기는
            # maxChanges 다 — 나눠 보내면 호출마다 코퍼스를 다시 순회하게 되므로,
            # 색인 부하를 줄이려면 maxChanges 를 낮춰야 한다.
            - index_if_needed:
                switch:
                  - condition: ${len(pending_uris) > 0}
                    steps:
                      - index_batch:
                          try:
                            call: http.post
                            args:
                              url: ${sync_url + "/sync/index-gcs-async"}
                              auth:
                                type: OIDC
                              body:
                                driveId: ${drive_id}
                                gcsUris: ${pending_uris}
                                fileIds: ${pending_file_ids}
                              timeout: 60
                            result: index_enqueue_resp
                          except:
                            as: index_err
                            steps:
                              # 색인 실패를 failed 에 더하면 이중 집계다 — 그 파일은
                              # 이미 gcsUploaded 로 세어져 reconcile 의 listed 항등식이
                              # 깨진다(unaccounted 가 음수). 별도 지표로 두고, 커밋은
                              # 아래 drive_indexed == drive_uris 가 막는다.
                              - index_fail:
                                  assign:
                                    - drive_index_failed: ${drive_index_failed + len(pending_uris)}
                                    - totals.indexFailed: ${totals.indexFailed + len(pending_uris)}
                              - index_log:
                                  call: sys.log
                                  args:
                                    severity: "ERROR"
                                    text: ${"index-gcs failed drive=" + drive_id + " uris=" + string(len(pending_uris)) + " " + json.encode_to_string(index_err)}
                              - log_index_failed_items:
                                  for:
                                    value: failed_item
                                    in: ${pending_items}
                                    steps:
                                      - log_index_failed_item:
                                          call: sys.log
                                          args:
                                            severity: "INFO"
                                            text: ${"sync-file-result status=INDEX_FAILED " + json.encode_to_string(failed_item)}
                              # 색인 실패 시 pageToken 미커밋 → 다음 배치에서 재시도
                              - skip_commit_on_index_fail:
                                  next: reconcile_drive
                      - init_index_poll:
                          assign:
                            - index_job_id: ${index_enqueue_resp.body.jobId}
                            - index_poll_count: 0
                      - poll_index_job:
                          switch:
                            - condition: ${index_poll_count >= 180}
                              raise: ${"index job timeout jobId=" + index_job_id}
                      - wait_index_job:
                          call: sys.sleep
                          args:
                            seconds: 5
                      - get_index_job:
                          call: http.get
                          args:
                            url: ${sync_url + "/sync/index-jobs/" + index_job_id}
                            auth:
                              type: OIDC
                            timeout: 60
                          result: index_status_resp
                      - route_index_job:
                          switch:
                            - condition: ${index_status_resp.body.status == "DONE"}
                              next: index_poll_complete
                            - condition: ${index_status_resp.body.status == "FAILED"}
                              raise: ${"index job failed jobId=" + index_job_id + " error=" + default(index_status_resp.body.error, "unknown")}
                      - continue_index_poll:
                          assign:
                            - index_poll_count: ${index_poll_count + 1}
                          next: poll_index_job
                      - index_poll_complete:
                          assign:
                            - index_resp: ${index_status_resp}
                      - index_ok:
                          assign:
                            - drive_indexed: ${default(index_resp.body.result.count, len(pending_uris))}
                            - totals.indexed: ${totals.indexed + default(index_resp.body.result.count, len(pending_uris))}
                      - log_indexed_items:
                          for:
                            value: indexed_item
                            in: ${pending_items}
                            steps:
                              - log_indexed_item:
                                  call: sys.log
                                  args:
                                    severity: "INFO"
                                    text: ${"sync-file-result status=INDEXED " + json.encode_to_string(indexed_item)}
                  - condition: true
                    steps:
                      - no_index:
                          assign:
                            - _: null

            # ----- 4) 정합성 검증 (Drive 조회 vs GCS 업로드·색인) -----
            - reconcile_drive:
                try:
                  call: http.post
                  args:
                    url: ${sync_url + "/sync/reconcile"}
                    auth:
                      type: OIDC
                    body:
                      driveId: ${drive_id}
                      listed: ${drive_listed}
                      gcsUploaded: ${drive_gcs}
                      uris: ${drive_uris}
                      indexed: ${drive_indexed}
                      failed: ${drive_failed}
                      skipped: ${drive_skipped}
                      deleted: ${drive_deleted}
                      unchanged: ${drive_unchanged}
                      dlq: ${drive_dlq}
                      splitQueued: ${drive_split}
                      parked: ${drive_parked}
                      excluded: ${drive_excluded}
                    timeout: 60
                  result: recon_resp
                except:
                  as: recon_err
                  steps:
                    - recon_log:
                        call: sys.log
                        args:
                          severity: "ERROR"
                          text: ${"reconcile failed drive=" + drive_id + " " + json.encode_to_string(recon_err)}
                    - skip_reconcile_result:
                        next: commit_token

            - record_reconcile_result:
                assign:
                  - drive_reconciled: ${default(recon_resp.body.ok, false)}

            # ----- 5) pageToken 커밋 (전체 처리·색인·정합성 검증 성공 시에만) -----
            - commit_token:
                switch:
                  - condition: ${pending_page_token != "" and drive_failed == 0 and drive_index_failed == 0 and drive_indexed == drive_uris and drive_reconciled == true}
                    steps:
                      - do_commit:
                          try:
                            call: http.post
                            args:
                              url: ${sync_url + "/sync/commit-token"}
                              auth:
                                type: OIDC
                              body:
                                driveId: ${drive_id}
                                pageToken: ${pending_page_token}
                              timeout: 60
                            result: commit_resp
                          retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 3
                            backoff:
                              initial_delay: 1
                              max_delay: 10
                              multiplier: 2
                          except:
                            as: commit_err
                            steps:
                              - tally_commit_failure:
                                  assign:
                                    - drive_failed: ${drive_failed + 1}
                                    - totals.failed: ${totals.failed + 1}
                              - log_commit_failure:
                                  call: sys.log
                                  args:
                                    severity: "ERROR"
                                    text: ${"commit-token exhausted retries drive=" + drive_id + " " + json.encode_to_string(commit_err)}
                              - continue_after_commit_failure:
                                  # 토큰은 미커밋 상태이므로 다음 실행에서 안전하게 재처리한다.
                                  next: continue
                  - condition: true
                    steps:
                      - defer_commit:
                          call: sys.log
                          args:
                            severity: "WARNING"
                            text: ${"pageToken NOT committed drive=" + drive_id + " failed=" + string(drive_failed) + " indexFailed=" + string(drive_index_failed) + " reconciled=" + string(drive_reconciled) + " gcs=" + string(drive_gcs) + " uris=" + string(drive_uris) + " indexed=" + string(drive_indexed) + " (parked=" + string(drive_parked) + " 는 커밋을 막지 않는다)"}

            # ----- 6) 다음 페이지 -----
            # 커밋 조건과 동일해야 한다. 토큰이 커밋되지 않았는데 되돌아가면 같은
            # 페이지를 무한히 다시 받는다. 남은 분량은 다음 실행이 이어받는다.
            - next_page:
                switch:
                  - condition: ${drive_has_more == true and pending_page_token != "" and drive_failed == 0 and drive_index_failed == 0 and drive_indexed == drive_uris and drive_reconciled == true and drive_page < max_pages}
                    next: sync_page
                  - condition: ${drive_has_more == true}
                    steps:
                      - log_page_loop_stopped:
                          call: sys.log
                          args:
                            severity: "WARNING"
                            text: ${"delta paging stopped with work remaining drive=" + drive_id + " page=" + string(drive_page) + " failed=" + string(drive_failed) + " reconciled=" + string(drive_reconciled) + " — resumes next run"}

    # ----- 6) 명시적 복구: 색인 누락(PARSED) → 재색인, 실패(FAILED/DLQ) → ingest 재시도 -----
    # 일반 변경분/백필 실행은 여기서 끝난다. 전역 backlog 복구는 runRecovery=true
    # 로 별도 실행해야 현재 변경분의 소요 시간과 성공 여부를 오염시키지 않는다.
    - check_recovery_enabled:
        switch:
          - condition: ${run_recovery == false}
            next: finalize_summary

    - recover_pending_index:
        try:
          call: http.post
          args:
            url: ${sync_url + "/sync/reindex-pending"}
            auth:
              type: OIDC
            body:
              limit: ${recover_limit}
              indexBatchSize: ${index_batch_size}
            timeout: 900
          result: reindex_resp
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 2
          backoff:
            initial_delay: 5
            max_delay: 60
            multiplier: 2
        except:
          as: reindex_err
          steps:
            - tally_reindex_call_failure:
                assign:
                  - totals.failed: ${totals.failed + 1}
            - reindex_log_err:
                call: sys.log
                args:
                  severity: "ERROR"
                  text: ${"reindex-pending failed " + json.encode_to_string(reindex_err)}
            - reindex_skip:
                next: recover_failed

    - check_reindex_result:
        switch:
          - condition: ${default(reindex_resp.body.ok, false) == false}
            steps:
              - tally_reindex_incomplete:
                  assign:
                    - totals.failed: ${totals.failed + 1}
              - log_reindex_incomplete:
                  call: sys.log
                  args:
                    severity: "ERROR"
                    text: ${"reindex-pending incomplete " + json.encode_to_string(default(reindex_resp.body.totals, empty_map))}
              - continue_to_failed_recovery:
                  next: recover_failed

    - log_reindex:
        call: sys.log
        args:
          severity: "INFO"
          text: ${"reindex-pending " + json.encode_to_string(default(reindex_resp.body.totals, empty_map))}

    - recover_failed:
        try:
          call: http.post
          args:
            url: ${sync_url + "/sync/retry-failed"}
            auth:
              type: OIDC
            body:
              limit: ${recover_limit}
              parserUrl: ${parser_url}
              maxAttempts: ${retry_max_attempts}
              indexBatchSize: ${index_batch_size}
            timeout: 1800
          result: retry_resp
        retry:
          predicate: ${http.default_retry_predicate}
          max_retries: 2
          backoff:
            initial_delay: 5
            max_delay: 60
            multiplier: 2
        except:
          as: retry_err
          steps:
            - tally_retry_call_failure:
                assign:
                  - totals.failed: ${totals.failed + 1}
            - retry_log_err:
                call: sys.log
                args:
                  severity: "ERROR"
                  text: ${"retry-failed failed " + json.encode_to_string(retry_err)}
            - retry_skip:
                next: finalize_summary

    - check_retry_result:
        switch:
          - condition: ${default(retry_resp.body.ok, false) == false}
            steps:
              - tally_retry_incomplete:
                  assign:
                    - totals.failed: ${totals.failed + 1}
              - log_retry_incomplete:
                  call: sys.log
                  args:
                    severity: "ERROR"
                    text: ${"retry-failed incomplete " + json.encode_to_string(default(retry_resp.body.totals, empty_map))}
              - finish_after_retry_incomplete:
                  next: finalize_summary

    - log_retry:
        call: sys.log
        args:
          severity: "INFO"
          text: ${"retry-failed " + json.encode_to_string(default(retry_resp.body.totals, empty_map))}

    - warn_if_parked:
        switch:
          - condition: ${totals.parked > 0}
            steps:
              - log_parked:
                  call: sys.log
                  args:
                    severity: "WARNING"
                    # ok 를 뒤집지 않는다 — 다시 돌려도 같은 결과라 실행 실패로
                    # 보고하면 매일 거짓 경보가 된다. 대신 여기서 눈에 띄게 남긴다.
                    text: ${"parked " + string(totals.parked) + " docs (dlq=" + string(totals.dlq) + " splitQueued=" + string(totals.splitQueued) + ") — 큐에 남아 있고 자동 회수되지 않는다"}

    # Workflow 실행 상태도 실제 결과와 같아야 한다. return ok=false 는 콘솔에서
    # SUCCEEDED 로 보이므로 Scheduler/알림이 부분 실패를 정상으로 오인한다.
    - finalize_summary:
        switch:
          - condition: ${totals.failed > 0 or totals.indexFailed > 0}
            raise: ${"sync incomplete " + json.encode_to_string(totals)}

    - return_summary:
        return:
          ok: true
          totals: ${totals}
          region: ${region}
          projectId: ${project_id}
